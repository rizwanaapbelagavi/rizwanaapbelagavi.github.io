<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AAP Belagavi Premium Poster Maker</title>
<style>
:root{--blue:#173f78;--yellow:#ffc400}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eaf3fb,#dce8f5);color:#142d52}.wrap{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 35px rgba(20,55,95,.16)}h1{margin:0;text-align:center;color:var(--blue);font-size:30px;line-height:1.05}.sub{text-align:center;color:#777;font-size:18px;margin:8px 0 20px}label{display:block;font-weight:800;color:var(--blue);font-size:18px;margin:16px 0 7px}input{width:100%;padding:14px;border:2px solid #cbd9e8;border-radius:14px;font-size:16px;background:#fff}.hint{font-size:13px;color:#666;margin-top:6px}button{width:100%;border:0;border-radius:15px;padding:16px;font-size:19px;font-weight:800;cursor:pointer;margin-top:18px}#generate{background:var(--blue);color:#fff}#download{background:var(--yellow);color:#063b8c}.previewBox{margin-top:22px;background:#dfe9f4;padding:12px;border-radius:22px;overflow:hidden;text-align:center}canvas{display:block;width:100%;height:auto;border-radius:8px}.small{font-size:11px;color:#777;text-align:center;margin-top:10px;line-height:1.35}.status{text-align:center;font-weight:700;margin-top:10px;color:#1b5b99;min-height:18px}
</style></head><body><div class="wrap"><div class="card"><h1>AAP Belagavi Premium<br>Poster Maker</h1><div class="sub">1080 × 1350 • Together for a Better Belagavi</div>
<label>Member 2 Name</label><input id="memberName" type="text" value="ASLAM TASHILDAR"><label>Designation</label><input id="designation" type="text" value="MINORITY PRESIDENT"><label>Photo</label><input id="memberPhoto" type="file" accept="image/*"><div class="hint">Upload Aslam Tashildar's photo. JPG/PNG both work.</div><button id="generate">Generate Poster</button><button id="download">Download Poster PNG</button><div id="status" class="status"></div></div><div class="previewBox"><canvas id="poster" width="1080" height="1350"></canvas><div class="small">Fixed members: Vijay L. Patil and Rizwanahmed K. Makandar.<br>Only Member 2 name, designation and photo are editable.</div></div></div>
<script>
const C=document.getElementById('poster'),x=C.getContext('2d'),W=1080,H=1350,BLUE='#173f78',DEEP='#0d3268',YELLOW='#ffc400';let vijay=null,rizwan=null,aslam=null,bg=null;
const BG='https://upload.wikimedia.org/wikipedia/commons/2/2b/Vidhana_Souda_%2C_Bangalore.jpg';
function img(src,cross=false){return new Promise((ok,no)=>{let i=new Image();if(cross)i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=no;i.src=src})}
function rr(a,b,w,h,r,f,s,l=1){x.beginPath();x.roundRect(a,b,w,h,r);if(f){x.fillStyle=f;x.fill()}if(s){x.lineWidth=l;x.strokeStyle=s;x.stroke()}}
function fit(i,a,b,w,h,contain=true){if(!i)return;let r=contain?Math.min(w/i.width,h/i.height):Math.max(w/i.width,h/i.height),sw=i.width*r,sh=i.height*r;x.drawImage(i,a+(w-sw)/2,b+(h-sh)/2,sw,sh)}
function t(v,a,b,z,wt='700',co='#fff',al='center'){x.font=`${wt} ${z}px Arial`;x.fillStyle=co;x.textAlign=al;x.textBaseline='middle';x.fillText(v,a,b)}
function wrap(v,a,b,mw,lh,z,wt,co){x.font=`${wt} ${z}px Arial`;x.fillStyle=co;x.textAlign='center';x.textBaseline='top';let w=v.split(/\s+/),ln='',ls=[];for(let q of w){let q2=ln?ln+' '+q:q;if(x.measureText(q2).width>mw&&ln){ls.push(ln);ln=q}else ln=q2}if(ln)ls.push(ln);ls.forEach((q,i)=>x.fillText(q,a,b+i*lh))}
function logo(){t('aap',105,67,72,'900',BLUE);x.fillStyle=BLUE;x.fillRect(42,112,158,8);x.fillRect(42,142,158,57);t('AAM AADMI',121,159,22,'800','#fff');t('PARTY',121,184,22,'800','#fff')}
function bgdraw(){x.clearRect(0,0,W,H);x.fillStyle='#eef5fb';x.fillRect(0,0,W,H);if(bg){x.save();x.globalAlpha=.43;fit(bg,0,250,W,560,false);x.restore();x.fillStyle='rgba(255,255,255,.38)';x.fillRect(0,250,W,560)}else{let g=x.createLinearGradient(0,0,0,820);g.addColorStop(0,'#79b9e8');g.addColorStop(.6,'#dbe7e7');g.addColorStop(1,'#f4d6a5');x.fillStyle=g;x.fillRect(0,0,W,820);x.fillStyle='rgba(23,63,120,.22)';x.fillRect(175,480,730,180);x.fillRect(260,420,560,60);x.beginPath();x.arc(540,420,65,Math.PI,2*Math.PI);x.fill()}}
function header(){logo();rr(825,28,225,190,28,DEEP,YELLOW,3);t('“',850,55,52,'900',YELLOW,'left');t('”',1025,194,52,'900',YELLOW,'right');t('Let’s build',937,70,23,'700');t('a clean,',937,108,23,'900',YELLOW);t('honest &',937,142,23,'900');t('progressive',937,176,23,'900');t('Belagavi!',937,208,23,'900');t('TOGETHER FOR A',540,55,44,'900',BLUE);t('BETTER',540,107,68,'900',BLUE);t('BELAGAVI!',540,178,68,'900',BLUE);rr(285,217,510,58,8,YELLOW);t('Honest Politics • Real Change',540,246,27,'900','#111')}
function person(i,a,b,w,h,n,d){rr(a,b,w,h,28,'rgba(255,255,255,.96)','#c8d8e9',4);x.save();x.beginPath();x.roundRect(a+4,b+4,w-8,h-108,22);x.clip();fit(i,a+10,b+8,w-20,h-116,true);x.restore();x.fillStyle=BLUE;x.fillRect(a,b+h-108,w,108);t(n,a+w/2,b+h-72,26,'900',YELLOW);wrap(d,a+w/2,b+h-54,w-25,30,21,'800','#fff')}
function values(){let y=815;x.fillStyle=BLUE;x.fillRect(0,y,W,235);t('WE BELIEVE IN',540,y+43,43,'900');let c=[180,540,900],q=['GOOD GOVERNANCE','CORRUPTION-FREE GOVERNANCE','PEOPLE-CENTRIC GOVERNANCE'],d=['Transparent, accountable and people-first governance.','Zero tolerance towards corruption. Clean politics for a stronger Belagavi.','Inclusive development with honesty, equality and justice for all.'];c.forEach((z,i)=>{x.beginPath();x.arc(z,y+105,43,0,Math.PI*2);x.fillStyle='#fff';x.fill();t(i==0?'▥':i==1?'✓':'●',z,y+105,35,'900',BLUE);t(q[i],z,y+151,18,'900');wrap(d[i],z,y+174,275,24,15,'400','#fff')})}
function bottom(){rr(55,1070,970,92,24,BLUE,YELLOW,3);t('Join AAP Belagavi –',410,1102,36,'900');t('be a part of the change!',410,1140,29,'900',YELLOW);t('Follow on Instagram',820,1095,20,'800');t('bit.ly/aaprizwanmakandar',820,1130,18,'900',YELLOW);x.fillStyle='#fff';x.fillRect(0,1175,W,175);let c=[135,405,675,945],q=['HONESTY','SERVICE','UNITY','PROGRESS'],d=['in every decision','to every citizen','for a stronger Belagavi','for a better tomorrow'];c.forEach((z,i)=>{x.beginPath();x.arc(z,1212,29,0,Math.PI*2);x.fillStyle=BLUE;x.fill();t('✓',z,1212,25,'900');t(q[i],z,1250,19,'900',BLUE);t(d[i],z,1278,14,'400',BLUE)});x.fillStyle=YELLOW;x.fillRect(0,1344,W,6)}
function draw(){bgdraw();header();person(vijay,24,305,342,495,'VIJAY L. PATIL','DISTRICT PRESIDENT BELGAUM');person(aslam,369,305,342,495,document.getElementById('memberName').value.trim()||'ASLAM TASHILDAR',document.getElementById('designation').value.trim()||'MINORITY PRESIDENT');person(rizwan,714,305,342,495,'RIZWANAHMED K. MAKANDAR','CITY PRESIDENT BELAGAVI');values();bottom();document.getElementById('status').textContent='Poster ready ✓'}
document.getElementById('memberPhoto').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{aslam=new Image();aslam.onload=draw;aslam.src=r.result};r.readAsDataURL(f)};
document.getElementById('generate').onclick=draw;document.getElementById('download').onclick=()=>{try{let a=document.createElement('a');a.download='AAP-Belagavi-Member-Poster.png';a.href=C.toDataURL('image/png');a.click()}catch(e){document.getElementById('status').textContent='Please tap Generate Poster once, then Download again.'}};
(async()=>{try{bg=await img(BG,true)}catch(e){}try{vijay=await img('vijay.png')}catch(e){}try{rizwan=await img('rizwan.png')}catch(e){}draw()})();
</script></body></html>
