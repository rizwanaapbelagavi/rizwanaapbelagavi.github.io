<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belagavi Member Poster Maker</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef3f8;
    color:#173f78;
  }
  .wrap{max-width:920px;margin:auto;padding:22px}
  h1{text-align:center;font-size:34px;margin:10px 0 8px}
  .sub{text-align:center;color:#555;font-size:17px;margin-bottom:22px}
  .card{
    background:#fff;border-radius:20px;padding:22px;
    box-shadow:0 8px 28px rgba(0,0,0,.08);
  }
  label{display:block;font-weight:700;font-size:18px;margin:15px 0 8px}
  input[type=text],input[type=file]{
    width:100%;padding:14px;border:1px solid #c9d5e2;border-radius:12px;
    font-size:16px;background:#fff;
  }
  button{
    width:100%;border:0;border-radius:14px;padding:16px;
    font-size:19px;font-weight:700;cursor:pointer;margin-top:18px;
  }
  #generate{background:#2478d0;color:#fff}
  #download{background:#149447;color:#fff;display:none}
  .note{
    margin-top:18px;padding:14px 16px;background:#f6f8fb;
    border-left:6px solid #f2b500;border-radius:10px;color:#555;
  }
  .poster-shell{
    margin-top:28px;background:#fff;border-radius:20px;padding:10px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
  }
  canvas{display:block;width:100%;height:auto;border-radius:12px}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Belagavi Member Poster Maker</h1>
  <div class="sub">Create a personalized member poster with a name, designation and transparent PNG photo.</div>

  <div class="card">
    <label for="memberName">Member Name</label>
    <input id="memberName" type="text" placeholder="Enter member name">

    <label for="designation">Designation</label>
    <input id="designation" type="text" placeholder="Enter designation">

    <label for="memberPhoto">Member Photo (PNG recommended)</label>
    <input id="memberPhoto" type="file" accept="image/png,image/jpeg,image/webp">

    <button id="generate">Generate Poster</button>
    <button id="download">Download Poster</button>

    <div class="note">
      <b>Photo tip:</b> For the cleanest professional result, upload a PNG with a transparent background.
    </div>
  </div>

  <div class="poster-shell">
    <canvas id="poster" width="1080" height="1528"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById("poster");
const ctx = canvas.getContext("2d");
const nameInput = document.getElementById("memberName");
const designationInput = document.getElementById("designation");
const photoInput = document.getElementById("memberPhoto");
const downloadBtn = document.getElementById("download");

const vijay = new Image();
const rizwan = new Image();
vijay.src = "vijay.png";
rizwan.src = "rizwan.png";

let memberImg = null;

function roundRect(x,y,w,h,r,fill,stroke=null,lw=1){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}
}

function fitImage(img,x,y,w,h,pad=18){
  const iw=img.naturalWidth||img.width, ih=img.naturalHeight||img.height;
  if(!iw||!ih)return;
  const scale=Math.min((w-pad*2)/iw,(h-pad*2)/ih);
  const dw=iw*scale, dh=ih*scale;
  const dx=x+(w-dw)/2, dy=y+(h-dh)/2;
  ctx.drawImage(img,dx,dy,dw,dh);
}

function brushBand(y,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(0,y,1080,h);
  ctx.fillStyle="rgba(255,255,255,.18)";
  for(let i=0;i<20;i++){
    ctx.fillRect(Math.random()*1080,y+Math.random()*h,70+Math.random()*160,2);
  }
}

function text(txt,x,y,size,color,align="center",weight="700"){
  ctx.font=`${weight} ${size}px Arial`;
  ctx.fillStyle=color;
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.fillText(txt,x,y);
}

function drawPoster(){
  ctx.clearRect(0,0,1080,1528);

  // Background
  const g=ctx.createLinearGradient(0,0,0,1528);
  g.addColorStop(0,"#f8fafc");
  g.addColorStop(.45,"#eef3f8");
  g.addColorStop(1,"#dfe9f3");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,1080,1528);

  // Decorative brush strokes
  ctx.globalAlpha=.95;
  brushBand(0,34,"#173f78");
  ctx.globalAlpha=1;

  // Header
  text("TOGETHER FOR A",540,95,44,"#111","center","800");
  text("BETTER BELAGAVI!",540,155,72,"#173f78","center","900");
  ctx.fillStyle="#f2b500";
  ctx.fillRect(245,192,590,9);
  text("HONEST • RESPONSIBLE • PEOPLE-CENTRIC",540,225,24,"#173f78");

  // Three photo cards
  const top=285, cardH=510, gap=28, cardW=324;
  const xs=[39,378,717];

  xs.forEach((x,i)=>{
    roundRect(x,top,cardW,cardH,22,"#fff","#c7d5e4",4);
  });

  // Photo areas
  fitImage(vijay,xs[0],top+8,cardW,385,12);
  if(memberImg) fitImage(memberImg,xs[1],top+8,cardW,385,12);
  fitImage(rizwan,xs[2],top+8,cardW,385,12);

  // Center placeholder if no member photo
  if(!memberImg){
    roundRect(xs[1]+22,top+42,cardW-44,315,16,"#dfe8f2");
    text("UPLOAD PHOTO",540,top+200,25,"#173f78");
  }

  // Name strips
  [xs[0],xs[1],xs[2]].forEach(x=>{
    ctx.fillStyle="#173f78";ctx.fillRect(x,top+388,cardW,67);
    ctx.fillStyle="#f2b500";ctx.fillRect(x,top+455,cardW,8);
  });

  text("VIJAY L. PATIL",xs[0]+cardW/2,top+420,25,"#f2b500");
  text(nameInput.value.trim()||"MEMBER NAME",xs[1]+cardW/2,top+420,24,"#f2b500");
  text("RIZWANAHMED K. MAKANDAR",xs[2]+cardW/2,top+420,21,"#f2b500");

  text("DISTRICT PRESIDENT",xs[0]+cardW/2,top+480,20,"#173f78");
  text(designationInput.value.trim()||"MEMBER",xs[1]+cardW/2,top+480,20,"#173f78");
  text("CITY PRESIDENT",xs[2]+cardW/2,top+480,20,"#173f78");

  // Believe section
  brushBand(835,265,"#173f78");
  text("WE BELIEVE IN",540,875,42,"#fff");
  const centers=[180,540,900];
  const titles=["GOOD GOVERNANCE","CLEAN GOVERNANCE","PEOPLE FIRST"];
  const desc=["Transparent & accountable","Honest public service","Service to citizens"];
  centers.forEach((cx,i)=>{
    ctx.beginPath();ctx.arc(cx,958,48,0,Math.PI*2);
    ctx.fillStyle="#fff";ctx.fill();
    text("✓",cx,958,32,"#173f78");
    text(titles[i],cx,1038,20,"#fff");
    text(desc[i],cx,1070,15,"#fff","center","400");
  });

  // Bottom
  ctx.fillStyle="#f2b500";ctx.fillRect(0,1125,1080,9);
  text("JOIN THE MOVEMENT • SERVE THE PEOPLE",540,1195,32,"#173f78");
  text("AAP BELAGAVI",540,1280,40,"#173f78","center","900");
  text("POWER TO THE PEOPLE",540,1332,28,"#173f78");
  text("BELAGAVI",540,1390,24,"#555","center","600");

  // Skyline-style decorative footer
  ctx.fillStyle="#173f78";
  for(let x=0;x<1080;x+=55){
    const h=35+((x*17)%80);
    ctx.fillRect(x,1528-h,42,h);
  }
}

photoInput.addEventListener("change",()=>{
  const file=photoInput.files[0];
  if(!file)return;
  const url=URL.createObjectURL(file);
  memberImg=new Image();
  memberImg.onload=()=>{drawPoster();URL.revokeObjectURL(url);};
  memberImg.src=url;
});

document.getElementById("generate").addEventListener("click",()=>{
  if(!nameInput.value.trim()){
    alert("Please enter member name.");
    nameInput.focus(); return;
  }
  if(!designationInput.value.trim()){
    alert("Please enter designation.");
    designationInput.focus(); return;
  }
  if(!photoInput.files[0]){
    alert("Please upload member photo.");
    photoInput.focus(); return;
  }
  drawPoster();
  downloadBtn.style.display="block";
  downloadBtn.scrollIntoView({behavior:"smooth",block:"center"});
});

downloadBtn.addEventListener("click",()=>{
  const a=document.createElement("a");
  a.download=(nameInput.value.trim()||"member")+"_poster.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
});

[vijay,rizwan].forEach(img=>img.onload=drawPoster);
drawPoster();
</script>
</body>
</html>
